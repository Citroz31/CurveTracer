name: Size experiment (temporary)

on:
  push:
    branches: [exp/size]

jobs:
  size:
    name: ${{ matrix.os }} ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        variant: [base, wgpu, wgpu-gles, wgpu-noacc, wgpu-noacc-fat, wgpu-gles-noacc-fat, glow-noacc, glow-noacc-fat]
        include:
          - os: ubuntu-latest
            variant: base
          - os: ubuntu-latest
            variant: wgpu-noacc-fat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Variant
        run: python .github/scripts/variant.py ${{ matrix.variant }}
      - name: wgpu features
        shell: bash
        run: |
          cargo fetch
          f=$(ls -d ~/.cargo/registry/src/*/wgpu-30* 2>/dev/null | head -1)
          [ -n "$f" ] && sed -n '/^\[features\]/,/^\[dependencies/p' "$f/Cargo.toml" | head -80 || true
      - name: Build
        run: cargo build --release
      - name: Size
        shell: bash
        run: ls -l target/release/CurveTracer* | grep -v '\.d$'
      - name: Bloat
        if: matrix.variant == 'base' || matrix.variant == 'wgpu-noacc-fat'
        shell: bash
        run: |
          cargo install cargo-bloat --locked
          cargo bloat --release --crates -n 40
