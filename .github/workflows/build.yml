name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests & lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Unit tests
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --release --all-targets

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bin: CurveTracer.exe
            artifact: CurveTracer-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            bin: CurveTracer
            artifact: CurveTracer-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build (release)
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/release/${{ matrix.bin }} dist/${{ matrix.artifact }}/
          cp README.md dist/${{ matrix.artifact }}/
          cp -r sample_data dist/${{ matrix.artifact }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-macos:
    name: Build macOS (tags / manual runs only)
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/CurveTracer-macos
          cp target/release/CurveTracer README.md dist/CurveTracer-macos/
          cp -r sample_data dist/CurveTracer-macos/
      - uses: actions/upload-artifact@v4
        with:
          name: CurveTracer-macos
          path: dist/CurveTracer-macos

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: cd artifacts && for d in */; do zip -qr "${d%/}.zip" "$d"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
