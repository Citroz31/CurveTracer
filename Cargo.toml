[package]
name = "curve_tracer"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
description = "CurveTracer – fast, interactive curve plotting from CSV / Excel measurement files"
publish = false

[[bin]]
name = "CurveTracer"
path = "src/main.rs"

[build-dependencies]
# Windows icon, version information and manifest of the executable
winresource = "0.1"

[dependencies]
# GUI. Only the graphics backend of each system is compiled (DirectX 12 on
# Windows, which also runs without a GPU driver through its software
# renderer; Metal on macOS; Vulkan / OpenGL ES on Linux) and the
# accessibility layer is left out: the executable is 30 % smaller. OpenGL
# alone (glow) would be smaller still but does not start on PCs without a
# GPU driver (virtual machines, Remote Desktop).
eframe = { version = "0.36", default-features = false, features = [
  "default_fonts",
  "links",
  "wayland",
  "x11",
  "wgpu_no_default_features",
] }
egui = "0.36"
egui_plot = "0.37"
epaint_default_fonts = "0.36"
rfd = "0.17"

# Data input / output
calamine = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"

# Static rendering for PNG / PowerPoint export
tiny-skia = "0.11"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal"] }
egui-wgpu = { version = "0.36", features = ["macos-window-resize-jitter-fix"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }

[profile.release]
# full speed for the data, the plots and the exports; whole-program
# optimization (smaller and as fast)
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Crates that only work at start-up (shader translation) or very little per
# frame (window events, GPU submission, file dialogs) are optimized for size;
# the data, plot and export code above keeps the full speed (opt-level 3).
[profile.release.package.naga]
opt-level = "s"

[profile.release.package.wgpu-core]
opt-level = "s"

[profile.release.package.wgpu-hal]
opt-level = "s"

[profile.release.package.wgpu]
opt-level = "s"

[profile.release.package.wgpu-types]
opt-level = "s"

[profile.release.package.egui-wgpu]
opt-level = "s"

[profile.release.package.codespan-reporting]
opt-level = "s"

[profile.release.package.rfd]
opt-level = "s"

[profile.release.package.winit]
opt-level = "s"

[profile.release.package.egui-winit]
opt-level = "s"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
# Dependencies are compiled with optimizations even in debug builds
# so that the GUI stays fluid while developing.
opt-level = 2
