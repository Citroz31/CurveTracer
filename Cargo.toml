[package]
name = "curve_tracer"
version = "0.3.3"
edition = "2024"
rust-version = "1.95"
description = "CurveTracer – fast, interactive curve plotting from CSV / Excel measurement files"
publish = false

[[bin]]
name = "CurveTracer"
path = "src/main.rs"

[dependencies]
# GUI
eframe = "0.36"
egui = "0.36"
egui_plot = "0.37"
epaint_default_fonts = "0.36"
rfd = "0.17"

# Data input / output
calamine = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"

# Static rendering for PNG / PowerPoint export
tiny-skia = "0.11"
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
# Dependencies are compiled with optimizations even in debug builds
# so that the GUI stays fluid while developing.
opt-level = 2
